name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

env:
  SIGNATURES_BRANCH: cla-signatures
  SIGNATURES_PATH: signatures/version1/cla.json

jobs:
  cla:
    name: Contributor License Agreement
    if: github.event_name == 'pull_request_target' || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') || github.event.comment.body == 'recheck'
    runs-on: ubuntu-latest
    steps:
      - name: Create the signatures branch and file when missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SIGNATURES_BRANCH" > /dev/null 2>&1 \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$SIGNATURES_BRANCH" -f "sha=$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/contents/$SIGNATURES_PATH?ref=$SIGNATURES_BRANCH" > /dev/null 2>&1 \
            || gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$SIGNATURES_PATH" -f "branch=$SIGNATURES_BRANCH" -f "message=Create the file storing the CLA signatures" -f "content=$(printf '{ "signedContributors": [] }' | base64 -w0)"

      - name: Check the agreement
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: ${{ env.SIGNATURES_PATH }}
          branch: ${{ env.SIGNATURES_BRANCH }}
          allowlist: louis-rt,louis-rt-2,*[bot]
          custom-notsigned-prcomment: >-
            Thank you for the pull request, I appreciate the help.
            Before I can accept a contribution, I ask $you to sign the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md).
            One signature covers this and every later pull request,
            and it is given by posting the sentence below as a comment:
